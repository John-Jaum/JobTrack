  /maintenance-requests:
    get:
      tags:
      - Maintenance Requests
      summary: List maintenance requests
      operationId: listMaintenanceRequests
      x-roles:
      - Requester
      - Facilities Officer
      - Technician
      - Administrator
      description: '**Visibility is enforced server-side by role.** Requester: only requests where `requester_id`
        equals the caller; a `requester_id` filter is ignored and another user''s request id returns 404. Facilities
        Officer and Administrator: all requests. Technician: only requests linked to job orders they are assigned
        to. Inventory Staff: no access (403). For the My Requests page use `GET /me/maintenance-requests`.


        **Allowed roles:** Requester, Facilities Officer, Technician, Administrator.'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Matches reference (e.g. MR-0005), location, category or requester name
      - name: status_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: location_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Urgent
      - name: requester_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: submitted_from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: submitted_to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - submitted_at
          - -submitted_at
          - priority
          - -priority
          default: -submitted_at
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of requests
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceRequest'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Maintenance Requests
      summary: Submit a maintenance request
      operationId: createMaintenanceRequest
      x-roles:
      - Requester
      - Facilities Officer
      - Administrator
      description: '`requester_id` is always the authenticated user. `priority` is optional and defaults to Medium
        (the database default). Attach photos afterwards via the attachments endpoint, or send them in the same
        call as `multipart/form-data`; see **File uploads**.


        **Allowed roles:** Requester, Facilities Officer, Administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestCreateMultipart'
            encoding:
              files:
                contentType: image/jpeg, image/png, image/webp, application/pdf
      responses:
        '201':
          description: Created. Status starts as Pending.
