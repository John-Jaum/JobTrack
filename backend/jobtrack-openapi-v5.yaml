components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    UserId:
      name: userId
      in: path
      required: true
      description: User id
      schema:
        type: integer
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category id
      schema:
        type: integer
        minimum: 1
    LocationId:
      name: locationId
      in: path
      required: true
      description: Location id
      schema:
        type: integer
        minimum: 1
    RequestId:
      name: requestId
      in: path
      required: true
      description: Maintenance request id (`request_id`, not the `MR-` reference)
      schema:
        type: integer
        minimum: 1
    JobOrderId:
      name: jobOrderId
      in: path
      required: true
      description: Job order id
      schema:
        type: integer
        minimum: 1
    TechnicianId:
      name: technicianId
      in: path
      required: true
      description: User id of the technician
      schema:
        type: integer
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment id
      schema:
        type: integer
        minimum: 1
    MaterialId:
      name: materialId
      in: path
      required: true
      description: Material id
      schema:
        type: integer
        minimum: 1
    MaterialRequestId:
      name: materialRequestId
      in: path
      required: true
      description: Material request id
      schema:
        type: integer
        minimum: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification id
      schema:
        type: integer
        minimum: 1
    LookupName:
      name: lookup
      in: path
      required: true
      description: Lookup table
      schema:
        type: string
        enum:
        - request_statuses
        - job_order_statuses
        - material_request_statuses
        - notification_types
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the user's role may not perform this action (or access this record)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found, or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current state of the resource (invalid status transition, duplicate,
        in-use record)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Too many attempts; see the `Retry-After` header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Upload exceeds the web server size limit (see File uploads)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PageMeta:
      type: object
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
        from:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        to:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
      required:
      - current_page
      - per_page
      - total
      - last_page
      - from
      - to
      description: Identical on every list endpoint. `from`/`to` are 1-based row positions, null when the page is
        empty.
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          enum:
          - unauthenticated
          - forbidden
          - not_found
          - conflict
          - invalid_transition
          - payload_too_large
          - validation_failed
          - too_many_requests
          - server_error
          description: Stable machine-readable reason; clients branch on this, not on `message`.
      required:
      - message
      - code
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            const: validation_failed
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        required:
        - errors
    LookupItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        label:
          type: string
      required:
      - id
      - label
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 100
          description: Label for the token, e.g. `web`
      required:
      - email
      - password
    AuthToken:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - token_type
      - user
    Role:
      type: object
      properties:
        role_id:
          type: integer
          minimum: 1
        role_name:
          type: string
          enum:
          - Requester
          - Facilities Officer
          - Technician
          - Inventory Staff
          - Administrator
        description:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
      required:
      - role_id
      - role_name
      x-table: roles
    UserSummary:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
      required:
      - user_id
      - full_name
      x-table: users
    User:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        role:
          $ref: '#/components/schemas/Role'
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        phone_number:
          oneOf:
          - type: string
            maxLength: 20
          - type: 'null'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - user_id
      - role
      - full_name
      - email
      - is_active
      - created_at
      x-table: users
    UserCreate:
      type: object
      properties:
        role_id:
          type: integer
          minimum: 1
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
        phone_number:
          type: string
          maxLength: 20
        is_active:
          type: boolean
          default: true
      required:
      - role_id
      - full_name
      - email
      - password
    UserUpdate:
      type: object
      properties:
        role_id:
          type: integer
          minimum: 1
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
        phone_number:
          type: string
          maxLength: 20
        is_active:
          type: boolean
    Category:
      type: object
      properties:
        category_id:
          type: integer
          minimum: 1
        category_name:
          type: string
          maxLength: 50
        description:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
      required:
      - category_id
      - category_name
      x-table: maintenance_categories
    CategoryWrite:
      type: object
      properties:
        category_name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
      required:
      - category_name
    Location:
      type: object
      properties:
        location_id:
          type: integer
          minimum: 1
        building_name:
          type: string
          maxLength: 100
        floor:
          oneOf:
          - type: string
            maxLength: 20
          - type: 'null'
        room_number:
          oneOf:
          - type: string
            maxLength: 20
          - type: 'null'
        description:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
      required:
      - location_id
      - building_name
      x-table: locations
    LocationWrite:
      type: object
      properties:
        building_name:
          type: string
          maxLength: 100
        floor:
          type: string
          maxLength: 20
        room_number:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 255
      required:
      - building_name
    Attachment:
      type: object
      properties:
        attachment_id:
          type: integer
          minimum: 1
        file_name:
          type: string
          description: Original file name, recovered from the stored path; not a database column
        url:
          type: string
          format: uri
          description: Temporary signed URL (15 minutes) to the `.../file` endpoint
        mime_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - application/pdf
          description: Derived from the stored file; not a database column
        size_bytes:
          type: integer
          maximum: 5242880
          description: Derived from the stored file; not a database column
        uploaded_by:
          $ref: '#/components/schemas/UserSummary'
        uploaded_at:
          type: string
          format: date-time
      required:
      - attachment_id
      - file_name
      - url
      - mime_type
      - size_bytes
      - uploaded_by
      - uploaded_at
      x-table: request_attachments | job_order_attachments
    UploadFiles:
      type: array
      maxItems: 5
      description: Shared by every multipart endpoint. At most 5 files per call; the rules in **File uploads** (5
        MB each, JPEG/PNG/WebP/PDF, 10 per record) apply and are enforced by the backend.
      items:
        type: string
        format: binary
        description: JPEG, PNG, WebP or PDF; max 5 MB (5,242,880 bytes)
    AttachmentUpload:
      type: object
      properties:
        files:
          allOf:
          - $ref: '#/components/schemas/UploadFiles'
          minItems: 1
      required:
      - files
    MaintenanceRequest:
      type: object
      properties:
        request_id:
          type: integer
          minimum: 1
        reference:
          type: string
          pattern: ^MR-\d{4,}$
          description: Display id used in the UI, e.g. `MR-0005`; derived from `request_id`.
        requester_id:
          type: integer
          minimum: 1
        requester_name:
          type: string
        category_id:
          type: integer
          minimum: 1
        category_label:
          type: string
          description: '`maintenance_categories.category_name`, e.g. `Electrical`'
        location_id:
          type: integer
          minimum: 1
        location_label:
          type: string
          description: Display string built from the location row, e.g. `Main Building, 2F, Room 204`
        status_id:
          type: integer
          minimum: 1
        status_label:
          type: string
          enum:
          - Pending
