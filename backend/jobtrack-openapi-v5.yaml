openapi: 3.1.0
info:
  title: JobTrack API
  version: 5.0.0
  summary: University facilities maintenance request and job order management
  description: "REST contract for JobTrack (Laravel backend, Bootstrap/JS frontend).\n\n**Conventions**\n- JSON\
    \ over HTTPS; all timestamps are ISO 8601 UTC.\n- Auth: Laravel Sanctum bearer token from `POST /auth/login`.\n\
    - Success bodies are wrapped as `{ \"data\": ... }`; lists add `meta` pagination (`page`, `per_page`).\n- Roles:\
    \ Requester, Facilities Officer, Technician, Inventory Staff, Administrator. Each operation lists its allowed\
    \ roles.\n- Status labels are enums here and are also served from lookup tables (`GET /lookups/{lookup}`). Priority\
    \ is a database ENUM, not a lookup table.\n\nDerived from the JobTrack database schema, the system proposal,\
    \ and the current frontend pages.\n\n## Authentication\nLaravel Sanctum **personal access tokens** (bearer).\
    \ The frontend is a static site on a different origin from the Laravel API, so SPA cookie auth is not used.\
    \ Backend setup: `php artisan install:api` (Sanctum is not yet in `composer.json`), allow the frontend origin\
    \ in `config/cors.php`, set `sanctum.expiration`. `POST /auth/login` is throttled (429 with `Retry-After`).\
    \ `POST /auth/logout` revokes the presented token.\n\n## Pagination (every list endpoint)\nQuery: `page` (default\
    \ 1) and `per_page` (default 15, max 100; reference-data lists default to 100). Response: `{ \"data\": [...],\
    \ \"meta\": { current_page, per_page, total, last_page, from, to } }`. Sorting, where offered, uses `sort=field`\
    \ or `sort=-field`. Report endpoints return a report object instead; `recurring-issues` is paginated like any\
    \ list.\n\n## Errors\nEvery error body is `{ \"message\": string, \"code\": string }`; 422 adds `errors: { field:\
    \ [messages] }`. `code` is a stable value: `unauthenticated` (401), `forbidden` (403), `not_found` (404), `conflict`\
    \ and `invalid_transition` (409), `payload_too_large` (413), `validation_failed` (422), `too_many_requests`\
    \ (429), `server_error` (500). Laravel's default error bodies have no `code`, so add it in the exception rendering\
    \ in `bootstrap/app.php`. Every operation can also return 500.\n\n## Record-level authorization\nRole checks\
    \ alone are not enough: each endpoint also applies a record-level rule (a Laravel Policy). **403** means the\
    \ caller's role may not use the endpoint, or the caller can see the record but may not perform the action. **404**\
    \ means the record is not visible to the caller, so its existence is not revealed.\n- **Maintenance request:**\
    \ a Requester sees and edits only their own; a Technician sees requests whose job order they are assigned to\
    \ (assignment not Declined); Facilities Officer and Administrator see all; Inventory Staff none.\n- **Job order:**\
    \ a Technician sees only job orders they are assigned to; Inventory Staff has read access to all; Officer and\
    \ Administrator everything. Requesters never see job orders directly, only the job order summary inside their\
    \ request.\n- **Job order children** (assignments, work records, materials used, attachments) are visible whenever\
    \ the job order is. Assigned technicians (Lead or Support) may record work and materials and upload files; only\
    \ the Lead may start, hold or complete the job order; a technician may change only their own assignment (403\
    \ on another technician's).\n- **Work records** are append-only (no update or delete endpoint) and are always\
    \ recorded for the caller as `technician_id`.\n- **Attachments** are visible with their parent record and deletable\
    \ by the uploader, an Officer or an Administrator.\n- **Material requests:** a Technician sees only their own;\
    \ Inventory Staff, Officer and Administrator see all. **Notifications:** own only (404 otherwise). **Users:**\
    \ Administrator only; everyone else uses `/auth/me`.\n\n## File uploads\nApplies to every `multipart/form-data`\
    \ endpoint with a `files[]` field. Validate in a Laravel FormRequest: at most **5 files** per call, **5 MB**\
    \ (5,242,880 bytes) per file, at most **10 attachments** per record in total; allowed content types `image/jpeg`,\
    \ `image/png`, `image/webp` and `application/pdf`, checked from the file contents (`mimetypes` rule), not the\
    \ client-supplied extension. Violations return 422 with `errors.files` or `errors.files.N`; a request over the\
    \ web server limit returns 413 (set `upload_max_filesize` and `post_max_size` to at least 26M). Files go on\
    \ a private disk under a random name (`{uuid}__{sanitised original name}`) and are never served from `public/`.\
    \ `Attachment.file_name` is the original name recovered from that path. `Attachment.url` is a temporary signed\
    \ URL (15 minutes) to the `.../file` endpoint, which needs no bearer token so it works in `<img>` and `<a>`.\n\
    \n## Closure and acknowledgement\n1. The assigned Lead technician completes the job order (In Progress → Completed);\
    \ the request becomes Completed and the requester is notified.\n2. The requester confirms with `POST /maintenance-requests/{id}/acknowledge`.\
    \ In one transaction the job order moves Completed → Closed (`closed_at` set) and the request becomes Closed.\
    \ The Officer who created the job order and the assigned technicians are notified.\n3. If the requester does\
    \ not respond, an Officer or Administrator may close the job order with `POST /job-orders/{id}/transitions`;\
    \ the request is closed with it.\n4. Before closure an Officer or Administrator may reopen the job order (Completed\
    \ → In Progress) for rework. **Closed is final**: no further transitions, edits or acknowledgements (409).\n\
    Every step is audited in the append-only `job_order_status_history` table (who, when, from/to status, remarks,\
    \ and an event type that distinguishes the requester's acknowledgement from an Officer close). `GET /job-orders/{id}/history`\
    \ lists it, and the job order detail exposes `closed_by`, `acknowledged_by` and `acknowledged_at` derived from\
    \ it.\n\n## Naming conventions\nsnake_case everywhere. Ids are `<entity>_id`. A lookup column is exposed as\
    \ `<name>_id` plus `<name>_label` (for example `status_id`, `status_label`), and lookup endpoints return `{id,\
    \ label}`. Priority is a database ENUM (Low, Medium, High, Urgent), not a lookup table, so it has no id/label\
    \ pair and no lookup endpoint. Timestamps are `*_at` (ISO 8601 UTC), dates are `*_date`, booleans are `is_*`.\
    \ Related records are nested summary objects named for the relation (`requester`, `material`, `technician`).\
    \ Money, hours and quantities are JSON numbers (cast DECIMAL to float in the API Resource; Eloquent returns\
    \ strings by default).\n\n## Job order status transitions\n| From | To | Who | Notes |\n|---|---|---|---|\n\
    | Approved | Assigned | Facilities Officer, Administrator | Manual, or automatic when the first technician is\
    \ assigned |\n| Assigned | Approved | system | Automatic when no active technician remains (all unassigned or\
    \ declined) |\n| Assigned | In Progress | Technician | Lead technician starts work |\n| In Progress | On Hold\
    \ | Technician, Facilities Officer, Administrator | Lead technician or Officer |\n| On Hold | In Progress |\
    \ Technician, Facilities Officer, Administrator | Resume |\n| In Progress | Completed | Technician | Lead technician\
    \ finishes work |\n| Completed | Closed | Facilities Officer, Administrator, system | System: requester acknowledgement\
    \ (`POST /maintenance-requests/{id}/acknowledge`). Officer or Administrator: manual close when the requester\
    \ does not respond |\n| Completed | In Progress | Facilities Officer, Administrator | Reopen for rework; only\
    \ before Closed. Closed is final |\n\nJob orders start as Approved (or Assigned when created with technicians).\
    \ Pending remains in the lookup table but is never an initial state. The request status mirrors the job order\
    \ from In Progress onward; acknowledgement or manual closure closes both (see Closure and acknowledgement).\n\
    \n## Role permissions (generated from each operation's `x-roles`)\n| Operation | Req | Officer | Tech | Inv\
    \ | Admin |\n|---|:-:|:-:|:-:|:-:|:-:|\n| `POST /auth/login` | public | public | public | public | public |\n\
    | `POST /auth/logout` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `GET /auth/me` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `GET /users` | – | –\
    \ | – | – | ✔ |\n| `POST /users` | – | – | – | – | ✔ |\n| `GET /users/{userId}` | – | – | – | – | ✔ |\n| `PATCH\
    \ /users/{userId}` | – | – | – | – | ✔ |\n| `GET /technicians` | – | ✔ | – | – | ✔ |\n| `GET /roles` | – | ✔\
    \ | – | – | ✔ |\n| `GET /categories` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `POST /categories` | – | – | – | – | ✔ |\n| `PATCH\
    \ /categories/{categoryId}` | – | – | – | – | ✔ |\n| `DELETE /categories/{categoryId}` | – | – | – | – | ✔ |\n\
    | `GET /locations` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `POST /locations` | – | – | – | – | ✔ |\n| `PATCH /locations/{locationId}`\
    \ | – | – | – | – | ✔ |\n| `DELETE /locations/{locationId}` | – | – | – | – | ✔ |\n| `GET /lookups/{lookup}`\
    \ | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `GET /maintenance-requests` | ✔ | ✔ | ✔ | – | ✔ |\n| `POST /maintenance-requests`\
    \ | ✔ | ✔ | – | – | ✔ |\n| `GET /me/maintenance-requests` | ✔ | ✔ | – | – | ✔ |\n| `GET /maintenance-requests/{requestId}`\
    \ | ✔ | ✔ | ✔ | – | ✔ |\n| `PATCH /maintenance-requests/{requestId}` | ✔ | ✔ | – | – | ✔ |\n| `DELETE /maintenance-requests/{requestId}`\
    \ | ✔ | – | – | – | ✔ |\n| `POST /maintenance-requests/{requestId}/review` | – | ✔ | – | – | ✔ |\n| `POST /maintenance-requests/{requestId}/acknowledge`\
    \ | ✔ | – | – | – | – |\n| `GET /maintenance-requests/{requestId}/attachments` | ✔ | ✔ | ✔ | – | ✔ |\n| `POST\
    \ /maintenance-requests/{requestId}/attachments` | ✔ | ✔ | – | – | ✔ |\n| `DELETE /maintenance-requests/{requestId}/attachments/{attachmentId}`\
    \ | ✔ | ✔ | – | – | ✔ |\n| `GET /maintenance-requests/{requestId}/attachments/{attachmentId}/file` | public\
    \ | public | public | public | public |\n| `GET /job-orders` | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /job-orders` | –\
    \ | ✔ | – | – | ✔ |\n| `GET /job-orders/{jobOrderId}` | – | ✔ | ✔ | ✔ | ✔ |\n| `PATCH /job-orders/{jobOrderId}`\
    \ | – | ✔ | – | – | ✔ |\n| `POST /job-orders/{jobOrderId}/transitions` | – | ✔ | ✔ | – | ✔ |\n| `GET /job-orders/{jobOrderId}/history`\
    \ | – | ✔ | ✔ | – | ✔ |\n| `GET /job-orders/{jobOrderId}/assignments` | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /job-orders/{jobOrderId}/assignments`\
    \ | – | ✔ | – | – | ✔ |\n| `PATCH /job-orders/{jobOrderId}/assignments/{technicianId}` | – | ✔ | ✔ | – | ✔ |\n\
    | `DELETE /job-orders/{jobOrderId}/assignments/{technicianId}` | – | ✔ | – | – | ✔ |\n| `GET /job-orders/{jobOrderId}/work-records`\
    \ | – | ✔ | ✔ | – | ✔ |\n| `POST /job-orders/{jobOrderId}/work-records` | – | – | ✔ | – | – |\n| `GET /job-orders/{jobOrderId}/materials`\
    \ | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /job-orders/{jobOrderId}/materials` | – | ✔ | ✔ | – | – |\n| `GET /job-orders/{jobOrderId}/attachments`\
    \ | – | ✔ | ✔ | – | ✔ |\n| `POST /job-orders/{jobOrderId}/attachments` | – | ✔ | ✔ | – | – |\n| `DELETE /job-orders/{jobOrderId}/attachments/{attachmentId}`\
    \ | – | ✔ | ✔ | – | ✔ |\n| `GET /job-orders/{jobOrderId}/attachments/{attachmentId}/file` | public | public\
    \ | public | public | public |\n| `GET /materials` | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /materials` | – | – | – |\
    \ ✔ | ✔ |\n| `GET /materials/{materialId}` | – | ✔ | ✔ | ✔ | ✔ |\n| `PATCH /materials/{materialId}` | – | –\
    \ | – | ✔ | ✔ |\n| `POST /materials/{materialId}/stock-adjustments` | – | – | – | ✔ | ✔ |\n| `GET /material-requests`\
    \ | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /material-requests` | – | ✔ | ✔ | – | – |\n| `GET /material-requests/{materialRequestId}`\
    \ | – | ✔ | ✔ | ✔ | ✔ |\n| `POST /material-requests/{materialRequestId}/fulfill` | – | – | – | ✔ | – |\n| `POST\
    \ /material-requests/{materialRequestId}/reject` | – | – | – | ✔ | – |\n| `GET /notifications` | ✔ | ✔ | ✔ |\
    \ ✔ | ✔ |\n| `POST /notifications/{notificationId}/read` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `POST /notifications/read-all`\
    \ | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `GET /dashboard/summary` | ✔ | ✔ | ✔ | ✔ | ✔ |\n| `GET /reports/maintenance-activity`\
    \ | – | ✔ | – | – | ✔ |\n| `GET /reports/recurring-issues` | – | ✔ | – | – | ✔ |\n\n## Data model alignment\
    \ (checked against `jobtrack_db.mwb`, schema `jobtrack_db`, 18 tables)\n- **Derived, not stored:** `reference`\
    \ (from `request_id`), `*_label`, `requester_name`, `attachment_count`, `is_low_stock`, attachment `file_name`/`mime_type`/`size_bytes`,\
    \ job order totals.\n- **Enforced by the API, not the database:** one Lead per job order, stock never below\
    \ zero, status transitions, requester-only visibility.\n- **Seed data required (the model contains none):**\
    \ the 5 role names, request and job order status names, material request status names, notification types. Spelling\
    \ must match the enums used here.\n- **Model limits to be aware of:** notifications link only to a job order\
    \ (null for request-level events); there are no columns for review remarks or a completed timestamp (acknowledgement\
    \ and closure are audited by the proposed `job_order_status_history` table below); `materials.current_stock`\
    \ is INT while `quantity_used` and `quantity_requested` are DECIMAL(10,2).\n\n## Required model addition (not\
    \ yet in `jobtrack_db.mwb`)\nThe acknowledgement and closure audit trail needs one new table. Add it to the\
    \ model and create a matching migration; it is append-only (no update or delete endpoint). Transition `remarks`\
    \ are stored here too.\n```sql\nCREATE TABLE job_order_status_history (\n  history_id     INT NOT NULL AUTO_INCREMENT,\n\
    \  job_order_id   INT NOT NULL,\n  from_status_id INT NULL,\n  to_status_id   INT NOT NULL,\n  event       \
    \   ENUM('Created','Status Change','Requester Acknowledgement') NOT NULL DEFAULT 'Status Change',\n  changed_by\
    \     INT NOT NULL,\n  changed_at     DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  remarks        VARCHAR(255)\
    \ NULL,\n  PRIMARY KEY (history_id),\n  INDEX (job_order_id), INDEX (from_status_id), INDEX (to_status_id),\
    \ INDEX (changed_by),\n  FOREIGN KEY (job_order_id)   REFERENCES job_orders(job_order_id) ON DELETE CASCADE,\n\
    \  FOREIGN KEY (from_status_id) REFERENCES job_order_statuses(status_id),\n  FOREIGN KEY (to_status_id)   REFERENCES\
    \ job_order_statuses(status_id),\n  FOREIGN KEY (changed_by)     REFERENCES users(user_id)\n);\n```\n\n## Laravel\
    \ implementation notes\n- Routes in `routes/api.php` under the `v1` prefix with `auth:sanctum`; one Policy per\
    \ model, one FormRequest per write operation, one API Resource per response schema. Each DB-backed schema carries\
    \ an `x-table` extension naming its table.\n- Enums as PHP backed enums (`Priority`, `AssignmentRole`, `AssignmentStatus`);\
    \ roles and statuses from seeders (`x-seed-data`). The current frontend sends `Normal`; it must send `Medium`.\n\
    - Status changes go through one service class that applies the transition table in a DB transaction, mirrors\
    \ the request status, writes `approved_at` / `closed_at`, appends a `job_order_status_history` row and creates\
    \ notifications.\n- Stock deduction (job order materials, fulfilled material requests) uses `lockForUpdate()`\
    \ inside the transaction.\n- Paginate with `paginate($per_page)` and map to `{data, meta}`. `GET /me/maintenance-requests`\
    \ and `GET /maintenance-requests` share one query scope.\n- `reference` is `'MR-' . str_pad($request_id, 4,\
    \ '0', STR_PAD_LEFT)`; labels come from eager-loaded relations to avoid N+1 queries.\n\n## Seed data (required;\
    \ the model contains none)\n- roles: Requester, Facilities Officer, Technician, Inventory Staff, Administrator\n\
    - request_statuses: Pending, Approved, Rejected, In Progress, On Hold, Completed, Closed\n- job_order_statuses:\
    \ Pending, Approved, Assigned, In Progress, On Hold, Completed, Closed\n- material_request_statuses: Pending,\
    \ Fulfilled, Rejected\n- notification_types: New Request, Request Status Changed, Job Assigned, Material Request,\
    \ Material Request Update, Low Stock\n"
  contact:
    name: JobTrack team
servers:
- url: http://localhost:8000/api/v1
  description: Local (`php artisan serve`)
security:
- bearerAuth: []
tags:
- name: Auth
- name: Users
- name: Lookups
  description: Categories, locations, status tables
- name: Maintenance Requests
- name: Job Orders
- name: Materials & Inventory
- name: Notifications
- name: Dashboard & Reports
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in and receive an access token
      operationId: login
      description: 'Exchanges credentials for a Laravel Sanctum personal access token. Send it as `Authorization:
        Bearer <token>`. Accounts with `is_active = false` are rejected with 422. There is no public registration;
        accounts are created by an Administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current token
      operationId: logout
      x-roles:
      - Requester
      - Facilities Officer
      - Technician
      - Inventory Staff
      - Administrator
      description: '**Allowed roles:** Requester, Facilities Officer, Technician, Inventory Staff, Administrator.'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Current user profile
      operationId: getCurrentUser
      x-roles:
      - Requester
      - Facilities Officer
      - Technician
      - Inventory Staff
      - Administrator
      description: '**Allowed roles:** Requester, Facilities Officer, Technician, Inventory Staff, Administrator.'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /users:
    get:
      tags:
      - Users
      summary: List users
      operationId: listUsers
      x-roles:
      - Administrator
      description: '**Allowed roles:** Administrator.'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Search full name or email
      - name: role_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      x-roles:
      - Administrator
      description: '**Allowed roles:** Administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: Get a user
      operationId: getUser
      x-roles:
      - Administrator
      description: '**Allowed roles:** Administrator.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Users
      summary: Update a user, change role or deactivate
      operationId: updateUser
      x-roles:
      - Administrator
      description: '**Allowed roles:** Administrator.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /technicians:
    get:
      tags:
      - Users
      summary: List active technicians for assignment
      operationId: listTechnicians
      x-roles:
      - Facilities Officer
      - Administrator
      description: 'Convenience lookup of active users with the Technician role, used by the assignment picker.


        **Allowed roles:** Facilities Officer, Administrator.'
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Reference data defaults to 100 per page
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Active technicians
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /roles:
    get:
      tags:
      - Users
      summary: List roles
      operationId: listRoles
      x-roles:
      - Administrator
      - Facilities Officer
      description: '**Allowed roles:** Administrator, Facilities Officer.'
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Reference data defaults to 100 per page
