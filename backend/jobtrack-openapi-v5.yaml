- from: Assigned
  to: Approved
  roles:
  - system
  note: Automatic when no active technician remains (all unassigned or declined)
- from: Assigned
  to: In Progress
  roles:
  - Technician
  note: Lead technician starts work
- from: In Progress
  to: On Hold
  roles:
  - Technician
  - Facilities Officer
  - Administrator
  note: Lead technician or Officer
- from: On Hold
  to: In Progress
  roles:
  - Technician
  - Facilities Officer
  - Administrator
  note: Resume
- from: In Progress
  to: Completed
  roles:
  - Technician
  note: Lead technician finishes work
- from: Completed
  to: Closed
  roles:
  - Facilities Officer
  - Administrator
  - system
  note: 'System: requester acknowledgement (`POST /maintenance-requests/{id}/acknowledge`). Officer or Administrator:
    manual close when the requester does not respond'
- from: Completed
  to: In Progress
  roles:
  - Facilities Officer
  - Administrator
  note: Reopen for rework; only before Closed. Closed is final
